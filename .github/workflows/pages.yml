name: Pages

on:
  push:
    branches: [main]
    paths:
      - core/libs/**
      - tools/**
      - docs/needs/**
      - docs/inventory/**
      - README.md
      - .github/workflows/pages.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate progress
        run: |
          python tools/progress.py site
          python tools/progress_history.py site --ref HEAD
          python tools/needs.py site >> "$GITHUB_STEP_SUMMARY"
          python tools/stats_page.py README.md site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  refresh-readme:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge the README images from GitHub's image cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          gh api "repos/$GITHUB_REPOSITORY/readme" -H "Accept: application/vnd.github.html" \
            | grep -o 'https://camo\.githubusercontent\.com/[0-9a-f/]*' | sort -u \
            | while read -r url; do
                curl -s -o /dev/null -w "%{http_code} $url\n" -X PURGE "$url" || true
              done
